<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Social Media Template — Deadreckoner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{--teal:#14B0A0;--base:#0D0D0D;--text-primary:#F2F4F5;--text-secondary:#8B9196}
  *{box-sizing:border-box}
  body{margin:0;background:#1a1a1a;font-family:"IBM Plex Sans",sans-serif;display:flex;flex-direction:column;align-items:center;padding:24px}
  .toolbar{width:100%;max-width:540px;display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
  .toolbar span{color:#8B9196;font-size:13px}
  .toolbar button{padding:8px 16px;border:1px solid var(--teal);border-radius:6px;background:var(--teal);color:#07110f;font-weight:600;font-size:13px;cursor:pointer}
  .canvas-wrap{width:540px;height:540px;border-radius:8px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.5)}
  svg{display:block}
  .variants{display:flex;gap:16px;margin-top:24px;flex-wrap:wrap;justify-content:center}
  .variant-label{color:#8B9196;font-size:12px;font-family:"IBM Plex Mono",monospace;text-align:center;margin-top:8px}
</style>
</head>
<body>
  <div class="toolbar">
    <span>Social Media Template (1080×1080) — replace placeholder text, export below</span>
    <button id="downloadBtn">Download SVG</button>
  </div>

  <div class="canvas-wrap">
    <svg id="socialSvg" viewBox="0 0 1080 1080" width="540" height="540" xmlns="http://www.w3.org/2000/svg">
      <rect width="1080" height="1080" fill="#0D0D0D"/>
      <rect x="0" y="0" width="1080" height="1080" fill="none"/>
      <circle cx="900" cy="180" r="360" fill="#14B0A0" opacity="0.06"/>

      <!-- Teal accent bar -->
      <rect x="72" y="72" width="64" height="6" fill="#14B0A0" rx="3"/>

      <!-- Eyebrow -->
      <text x="72" y="150" font-family="IBM Plex Mono, monospace" font-size="22" letter-spacing="2" fill="#14B0A0">[CATEGORY / TAG]</text>

      <!-- Headline -->
      <text x="72" y="260" font-family="IBM Plex Sans, sans-serif" font-weight="600" font-size="64" fill="#F2F4F5">[Headline text</text>
      <text x="72" y="335" font-family="IBM Plex Sans, sans-serif" font-weight="600" font-size="64" fill="#F2F4F5">goes here]</text>

      <!-- Supporting line -->
      <text x="72" y="410" font-family="IBM Plex Sans, sans-serif" font-size="26" fill="#8B9196">[One-line supporting context or call to action.]</text>

      <!-- Footer / logo placeholder -->
      <text x="72" y="990" font-family="IBM Plex Mono, monospace" font-size="22" fill="#5A6066">[company.com]</text>
      <rect x="940" y="960" width="68" height="68" rx="12" fill="none" stroke="#5A6066" stroke-width="1.5"/>
      <text x="974" y="1002" font-family="IBM Plex Mono, monospace" font-size="20" fill="#5A6066" text-anchor="middle">LOGO</text>
    </svg>
  </div>

  <p class="variant-label">This is the Instagram/square (1:1) variant.<br>Duplicate and adjust the viewBox for Story (9:16) or landscape (16:9) formats — keep the same accent bar, type scale, and logo placement rules.</p>

  <script>
    document.querySelector('#downloadBtn').addEventListener('click', () => {
      const svg = document.querySelector('#socialSvg');
      const serializer = new XMLSerializer();
      const source = serializer.serializeToString(svg);
      const blob = new Blob([source], { type: 'image/svg+xml' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'social-media-template.svg';
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    });
  </script>
</body>
</html>
